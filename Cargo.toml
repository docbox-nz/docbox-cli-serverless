[package]
name = "docbox-cli-serverless"
version = "0.0.1"
edition = "2024"
authors = ["Jacobtread <jacobtread@gmail.com>"]
repository = "https://github.com/docbox-nz/docbox-cli-serverless"
readme = "./README.md"
license = "MIT"

[dependencies]
# Environment variables
dotenvy = "=0.15.7"

# Command line parser
clap = { version = "=4.6.4", features = ["derive"] }

# Management access
docbox-management = { version = "0.12.2" }

# Asynchronous runtime & Helpers
tokio = { version = "=1.53.1", features = ["full"] }

# Serialization and JSON
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

# Logging
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

# Error handling
thiserror = "=2.0.19"
eyre = "=0.6.12"
color-eyre = "=0.6.5"
tracing-indicatif = "0.3.13"
comfy-table = "7.2.1"

aws-sdk-lambda = { version = "1.117.0", default-features = false, features = [
  "default-https-client",
  "rt-tokio",
] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

